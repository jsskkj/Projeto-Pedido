<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Aceito</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Dancing Script', cursive;
            text-align: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        h1 {
            font-size: 3rem;
            color: #d6336c;
        }
        .texto {
            margin-top: 30px;
            font-size: 1.5rem;
            color: #333;
        }
        .gatinhos {
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }
        .gatinho {
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        .gatinho:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pedido Aceito!</h1>
        <div class="texto">
            <p>Agora que você aceitou, prepare-se para uma vida cheia de alegrias e muito amor!</p>
            <p>EU TE AMO MUITO!</p>
        </div>
        <div class="gatinhos">
            <img class="gatinho" src="imagens/gatinho1.jpg" alt="Gatinho 1">
            <img class="gatinho" src="imagens/gatinho2.jpg" alt="Gatinho 2">
            <img class="gatinho" src="imagens/gatinho3.jpg" alt="Gatinho 3">
            <img class="gatinho" src="imagens/gatinho4.jpg" alt="Gatinho 4">
            <img class="gatinho" src="imagens/gatinho5.jpg" alt="Gatinho 5">
            <img class="gatinho" src="imagens/gatinho6.jpg" alt="Gatinho 6">
        </div>
    </div>
</body>
</html>
